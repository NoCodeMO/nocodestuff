<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Afterlight">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d0a">
  <title>Afterlight Bunker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="assets/combat-sky.webp" type="image/webp">
  <link rel="preload" as="image" href="assets/combat-bunker.webp" type="image/webp">
  <link rel="stylesheet" href="app.css?build=6">
</head>
<body>
  <main id="app">
    <header id="hud">
      <div class="brand"><b>AFTERLIGHT</b><span>BUNKER PROTOCOL</span></div>
      <div class="resource" data-resource="coins" role="button" tabindex="0" aria-label="Open coin statistics"><i>◉</i><div><b id="coins">0</b><span id="cps">+0/s</span></div></div>
      <div class="resource" data-resource="food" role="button" tabindex="0" aria-label="Open food statistics"><i>🌿</i><div><b id="food">0</b><span id="foodps">+0/s</span></div></div>
      <div class="resource" data-resource="water" role="button" tabindex="0" aria-label="Open water statistics"><i>💧</i><div><b id="water">0</b><span id="waterps">+0/s</span></div></div>
      <div class="resource" data-resource="power" role="button" tabindex="0" aria-label="Open power statistics"><i>⚡</i><div><b id="power">0</b><span id="powerps">+0/s</span></div></div>
      <div class="resource" data-resource="scrap" role="button" tabindex="0" aria-label="Open scrap statistics"><i>⚙</i><div><b id="scrap">0</b><span>SCRAP</span></div></div>
      <div class="resource" data-resource="science" role="button" tabindex="0" aria-label="Open science statistics"><i>✦</i><div><b id="science">0</b><span id="scienceps">+0/s</span></div></div>
    </header>

    <section id="scene">
      <canvas id="game" width="480" height="520"></canvas>
      <div id="enemyCard">
        <span id="enemyType">WALKER</span><b id="enemyLevel">MUTATION 1</b>
        <div class="hp"><i id="enemyHp"></i></div><small id="enemyReward">REWARD 6</small>
      </div>
      <button id="clickCore" type="button"><span>TAP ZOMBIE</span><b id="clickValue">+1 DAMAGE</b></button>
    </section>

    <section id="bunker">
      <div class="sectionTitle"><span>YOUR BUNKER</span><small id="bunkerLevel">LEVEL 1</small></div>
      <div id="rooms"></div>
    </section>

    <nav id="tabs">
      <button class="active" data-tab="base">⌂<span>BASE</span></button>
      <button data-tab="build">🔨<span>BUILD</span></button>
      <button data-tab="research">⚗<span>RESEARCH</span><em id="researchBadge"></em></button>
      <button data-tab="expeditions">☣<span>EXPEDITIONS</span></button>
      <button id="missionNav" type="button">✦<span>MISSIONS</span><em id="missionBadge"></em></button>
      <button data-tab="stats">☷<span>STATS</span></button>
    </nav>

    <section id="drawer" class="hidden">
      <div class="drawerHead"><b id="drawerTitle">BUILD</b><button id="closeDrawer">×</button></div>
      <div id="drawerBody"></div>
    </section>

    <div id="offline" class="modal hidden">
      <div><span>☾</span><h2>THE BUNKER KEPT RUNNING</h2><p id="offlineText"></p><b id="offlineGain"></b><button id="offlineCollect">COLLECT</button></div>
    </div>
    <div id="toast"></div>
  </main>

  <!-- Load order is documented in PROJECT.md. -->
  <script src="js/core/config.js?build=3"></script>
  <script src="js/core/state.js?build=3"></script>
  <script src="js/systems/expeditions.js?build=3"></script>
  <script src="js/systems/special-rooms.js?build=2"></script>
  <script src="js/systems/research.js?build=1"></script>
  <script src="js/ui/visuals.js?build=4"></script>
  <script src="js/core/game.js?build=6"></script>
  <script src="js/systems/missions.js?build=3"></script>
  <script src="js/audio.js?build=7"></script>
  <script src="js/platform.js?build=2"></script>
</body>
</html>
