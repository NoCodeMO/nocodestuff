<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Afterlight">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d0a">
  <title>Afterlight Bunker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="assets/combat-sky.webp" type="image/webp">
  <link rel="preload" as="image" href="assets/combat-bunker-clean.webp" type="image/webp">
  <link rel="preload" as="image" href="assets/enemy-common-drifter.webp" type="image/webp">
  <link rel="preload" as="image" href="assets/enemy-common-drifter-death.png" type="image/png">
  <link rel="preload" as="image" href="assets/enemy-uncommon-cinderback-death.png" type="image/png">
  <link rel="preload" as="image" href="assets/enemy-rare-blue-shield-death.png" type="image/png">
  <link rel="preload" as="image" href="assets/survivor-ranger-female.webp" type="image/webp">
  <link rel="preload" as="image" href="assets/survivor-architect.webp" type="image/webp">
  <link rel="preload" as="image" href="assets/care-package-airborne.png" type="image/png">
  <link rel="preload" as="image" href="assets/care-package-crate.png" type="image/png">
  <link rel="preload" as="image" href="assets/room-generator.webp" type="image/webp">
  <link rel="stylesheet" href="app.css?build=39">
</head>
<body>
  <main id="app">
    <header id="hud">
      <div class="brand"><b>AFTERLIGHT</b><span>BUNKER PROTOCOL</span></div>
      <div class="resource" data-resource="coins" role="button" tabindex="0" aria-label="Open coin statistics"><i>◉</i><div><b id="coins">0</b><span id="cps">+0/s</span></div></div>
      <div class="resource" data-resource="food" role="button" tabindex="0" aria-label="Open food statistics"><i>🌿</i><div><b id="food">0</b><span id="foodps">+0/s</span></div></div>
      <div class="resource" data-resource="water" role="button" tabindex="0" aria-label="Open water statistics"><i>💧</i><div><b id="water">0</b><span id="waterps">+0/s</span></div></div>
      <div class="resource" data-resource="power" role="button" tabindex="0" aria-label="Open power statistics"><i>⚡</i><div><b id="power">0</b><span id="powerps">+0/s</span></div></div>
      <div class="resource" data-resource="scrap" role="button" tabindex="0" aria-label="Open scrap statistics"><i>⚙</i><div><b id="scrap">0</b><span>SCRAP</span></div></div>
      <div class="resource uraniumResource" data-resource="uranium" role="button" tabindex="0" aria-label="Open Uranium Crystal information"><i>◆</i><div><b id="uranium">0</b><span>U-CRYSTALS</span></div></div>
      <div class="resource" data-resource="science" role="button" tabindex="0" aria-label="Open science statistics"><i>✦</i><div><b id="science">0</b><span id="scienceps">+0/s</span></div></div>
    </header>

    <section id="scene">
      <aside id="activeBoostHud" class="hidden" aria-live="polite" aria-label="Active Dealer boosts"></aside>
      <canvas id="game" width="480" height="520"></canvas>
      <div id="enemyCard" role="button" tabindex="0" aria-label="Open Infected Codex">
        <span id="enemyType">WALKER</span><b id="enemyLevel">MUTATION 1</b>
        <div class="hp"><i id="enemyHp"></i></div><small id="enemyReward">REWARD 6</small><em id="hordeSignal">☣ HORDE SIGNAL 0 / 8</em><em id="enemyCodexHint">☷ INFECTED CODEX</em>
      </div>
      <button id="clickCore" type="button"><span>TAP ZOMBIE</span><b id="clickValue">+1 DAMAGE</b></button>
    </section>

    <section id="bunker">
      <div class="sectionTitle"><span>YOUR BUNKER</span><button id="operationsSummary" type="button" aria-label="Open the room with the greatest operating problem">✓ SYSTEMS NOMINAL</button><div id="bunkerProgressTrack" class="bunkerProgressTrack" role="progressbar" aria-label="Progress to next Bunker Level"><i id="bunkerProgress"></i><small id="bunkerProgressText">0 / 4 ROOM LEVELS</small></div><small id="bunkerLevel">LEVEL 1</small></div>
      <div id="rooms"></div>
    </section>

    <nav id="tabs">
      <button class="active" data-tab="base">⌂<span>BASE</span></button>
      <button data-tab="merchant">◆<span>DEALER</span><em id="merchantBadge"></em></button>
      <button data-tab="research">⚗<span>RESEARCH</span><em id="researchBadge"></em></button>
      <button data-tab="expeditions">☣<span>EXPEDITIONS</span></button>
      <button id="missionNav" type="button">✦<span>MISSIONS</span><em id="missionBadge"></em></button>
      <button data-tab="command">!<span>COMMAND</span><em id="commandBadge"></em></button>
    </nav>

    <section id="drawer" class="hidden">
      <div class="drawerHead"><b id="drawerTitle">DEALER</b><button id="closeDrawer">×</button></div>
      <div id="drawerBody"></div>
    </section>

    <div id="offline" class="modal hidden">
      <div><span>☾</span><h2>THE BUNKER KEPT RUNNING</h2><p id="offlineText"></p><b id="offlineGain"></b><button id="offlineCollect">COLLECT</button></div>
    </div>
    <div id="toast"></div>
  </main>

  <!-- Load order is documented in PROJECT.md. -->
  <script src="js/core/config.js?build=27"></script>
  <script src="js/core/economy.js?build=2"></script>
  <script src="js/core/numbers.js?build=1"></script>
  <script src="js/core/state.js?build=21"></script>
  <script src="js/systems/prestige.js?build=3"></script>
  <script src="js/systems/operations.js?build=2"></script>
  <script src="js/systems/expeditions.js?build=7"></script>
  <script src="js/systems/special-rooms.js?build=4"></script>
  <script src="js/systems/research.js?build=4"></script>
  <script src="js/systems/merchant.js?build=4"></script>
  <script src="js/systems/command-center.js?build=6"></script>
  <script src="js/ui/visuals.js?build=20"></script>
  <script src="js/systems/survivor-dialogue.js?build=1"></script>
  <script src="js/core/game.js?build=23"></script>
  <script src="js/systems/codex.js?build=1"></script>
  <script src="js/systems/offline.js?build=2"></script>
  <script src="js/systems/missions.js?build=9"></script>
  <script src="js/systems/care-package.js?build=2"></script>
  <script src="js/audio.js?build=13"></script>
  <script src="js/platform.js?build=3"></script>
</body>
</html>
