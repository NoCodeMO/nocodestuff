<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CLIO – Sign In</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="particles-bg"></canvas>
  <div class="login-container">
    <div class="login-content">
      <div class="logo">CLIO</div>
      <div class="typewriter">Your imagination. Amplified|</div>
      <form class="card" autocomplete="off">
        <h1 class="big-title">Welcome to <span style="color: #a855f7">CLIO</span></h1>
        <p class="subtitle">Privacy-first AI that helps you <span>create, think, and innovate</span> with confidence.</p>
        <button type="button" class="login-btn google" onclick="window.location='chat.html'">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          </span>
          Continue with Google
        </button>
        <div class="or-line">
          <span></span>
          <span>OR</span>
          <span></span>
        </div>
        <input class="email-input" type="email" placeholder="Enter your email" autocomplete="email" required>
        <button type="button" class="login-btn email" onclick="window.location='chat.html'">
          <span class="icon">✉️</span>
          Continue with email
        </button>
        <div class="tiny-text">By continuing, you agree to CLIO's <a href="#">Privacy Policy</a>.</div>
      </form>
      <button class="learn-more">Learn more <span class="arrow">↓</span></button>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
