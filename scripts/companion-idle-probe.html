<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Bunkr companion idle probe</title><style>html,body{margin:0;background:#050705}.probe{position:absolute;left:0;top:0;border:0}.portrait,.landscape{visibility:hidden}</style></head>
<body data-companion-idle-probe="running">
  <iframe class="probe desktop" data-profile="desktop" width="1200" height="800" title="Desktop companion probe"></iframe>
  <iframe class="probe portrait" data-profile="portrait" width="390" height="844" title="Portrait companion probe"></iframe>
  <iframe class="probe landscape" data-profile="landscape" width="844" height="390" title="Landscape companion probe"></iframe>
  <output id="companionReport" hidden></output>
  <script>
    (()=>{'use strict';
      const frames=[...document.querySelectorAll('iframe')],wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),report=document.getElementById('companionReport');
      const petIds=['ranger-dog','bolt','patch','rook-dog','drift','ash-hound','bluefang','ember','ghostwire','k9-xiii','rad-cat','switch-cat','cinder-cat','nocturne','snowdrop','signal-crow','scrap-ferret','tunnel-rat','salvage-fox','watch-owl'];
      localStorage.setItem('bunkr_last_shelter_v1',JSON.stringify({schema:20,prestige:{level:5},expeditions:{active:null,survivors:[],companions:petIds,selectedCompanion:'watch-owl',completed:{},visited:[],pending:null},last:Date.now()}));
      const imageAudit=(src,auditAlpha)=>new Promise(resolve=>{const image=new Image();image.onload=()=>{const result={width:image.naturalWidth,height:image.naturalHeight,clean:true,bottoms:[]};if(auditAlpha){const canvas=document.createElement('canvas');canvas.width=result.width;canvas.height=result.height;const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage(image,0,0);const pixels=context.getImageData(0,0,result.width,result.height).data,alphaAt=(x,y)=>pixels[(y*result.width+x)*4+3];for(let x=0;x<result.width;x++)if(alphaAt(x,0)||alphaAt(x,result.height-1))result.clean=false;for(let y=0;y<result.height;y++)if(alphaAt(0,y)||alphaAt(result.width-1,y))result.clean=false;for(let frame=0;frame<3;frame++){let bottom=-1;for(let y=result.height-1;y>=0&&bottom<0;y--)for(let x=frame*result.height;x<(frame+1)*result.height;x++)if(alphaAt(x,y)){bottom=y+1;break}result.bottoms.push(bottom)}result.clean=result.clean&&result.bottoms.every(bottom=>bottom===482)}resolve(result)};image.onerror=()=>resolve({width:0,height:0,clean:false,bottoms:[]});image.src='../'+src});
      async function inspect(frame){
        const doc=frame.contentDocument,win=frame.contentWindow,profile=frame.dataset.profile,unit=doc.querySelector('.companionUnit'),sprite=doc.querySelector('.companionSprite'),stage=doc.getElementById('spriteStage'),survivor=doc.querySelector('.survivorUnit'),enemy=doc.querySelector('.enemyUnit'),pets=win.BunkrConfig.EXPEDITION_COMPANIONS;
        const images=await Promise.all(pets.map(pet=>imageAudit(pet.asset,profile==='desktop'))),stageBox=stage.getBoundingClientRect(),survivorBox=survivor.getBoundingClientRect(),enemySprites=[...enemy.querySelectorAll('.enemySprite')].map(item=>item.getBoundingClientRect()).filter(item=>item.width>0),enemyLeft=enemySprites.length?Math.min(...enemySprites.map(item=>item.left)):stageBox.right,rendered=pets.map(pet=>{const ok=win.BunkrVisuals.applyCompanion(pet,false),box=unit.getBoundingClientRect(),spriteStyle=getComputedStyle(sprite),displayScale=Number.parseFloat(getComputedStyle(unit).getPropertyValue('--companion-scale')),expectedScale=(Number(pet.scale)||1)*1.1;return{ok:ok&&unit.dataset.companionId===pet.id&&spriteStyle.backgroundImage.includes(pet.asset)&&Math.abs(displayScale-expectedScale)<.001&&box.left>=stageBox.left&&box.right<=stageBox.right&&box.top>=stageBox.top&&box.bottom<=stageBox.bottom&&Math.abs(box.bottom-survivorBox.bottom)<=4&&box.right<=enemyLeft+10,baseline:Math.round(box.bottom-survivorBox.bottom),enemyGap:Math.round(enemyLeft-box.right),height:Math.round(box.height)}}),box=unit.getBoundingClientRect(),style=getComputedStyle(sprite),passed=pets.length===20&&images.every(image=>image.width===1536&&image.height===512&&image.width===image.height*3)&&(profile!=='desktop'||images.every(image=>image.clean))&&rendered.every(result=>result.ok)&&style.animationName==='companionIdleFrames'&&style.animationDuration==='3.6s'&&style.backgroundSize==='300% 100%';
        return{profile,passed,pets:pets.length,frames:images.filter(image=>image.width===1536&&image.height===512).length*3,alphaAudited:profile==='desktop'?images.filter(image=>image.clean).length:0,sizeBoost:1.1,animation:style.animationName,duration:style.animationDuration,strip:style.backgroundSize,bounds:[Math.round(box.left-stageBox.left),Math.round(box.top-stageBox.top),Math.round(box.width),Math.round(box.height)],baselineRange:[Math.min(...rendered.map(result=>result.baseline)),Math.max(...rendered.map(result=>result.baseline))],minimumEnemyGap:Math.min(...rendered.map(result=>result.enemyGap)),heightRange:[Math.min(...rendered.map(result=>result.height)),Math.max(...rendered.map(result=>result.height))]};
      }
      Promise.all(frames.map(frame=>new Promise(resolve=>{frame.addEventListener('load',()=>setTimeout(()=>inspect(frame).then(resolve),900));frame.src='../index.html?v=companion-idle-'+frame.dataset.profile}))).then(results=>{const passed=results.every(result=>result.passed);document.body.dataset.companionIdleProbe=passed?'passed':'failed';report.textContent='BUNKR_COMPANION_IDLE_'+(passed?'PASS ':'FAIL ')+JSON.stringify(results)}).catch(error=>{document.body.dataset.companionIdleProbe='failed';report.textContent='BUNKR_COMPANION_IDLE_FAIL '+error.stack});
    })();
  </script>
</body>
</html>
