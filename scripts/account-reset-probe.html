<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunkr account reset probe</title>
  <style>html,body{margin:0;background:#080a08;color:#fff;font:12px monospace}iframe{display:block;width:1000px;height:760px;border:0}</style>
</head>
<body data-account-reset-probe="running">
  <iframe id="gameFrame" title="Bunkr account reset probe"></iframe>
  <output id="resetReport" hidden></output>
  <script>
    (()=>{'use strict';
      const frame=document.getElementById('gameFrame'),report=document.getElementById('resetReport'),rich={schema:19,coins:8e77,total:9e88,food:700,water:600,power:500,scrap:400,science:300,uranium:200,kills:100,rooms:{generator:700,workshop:600},research:{tools:20},missions:{claimed:['m1']},expeditions:{active:{id:'store'},survivors:['maya'],pending:{coins:1}},merchant:{active:{gold10:Date.now()+999999}},prestige:{level:5,cores:9},survivorSkins:{selected:'prestige-5',unlocked:['ranger-male','ranger-female','prestige-5']},command:{account:{loggedIn:true,name:'OLD COMMANDER'}},last:Date.now()};let loads=0,started=false,done=false;
      localStorage.setItem('bunkr_last_shelter_v1',JSON.stringify(rich));localStorage.setItem('bunkr_prestige_backup_v1','old-backup');localStorage.setItem('bunkr_future_system','old-future');localStorage.setItem('afterlight_v4','legacy-save');localStorage.setItem('afterlight_future_system','legacy-future');localStorage.setItem('unrelated_probe_key','keep');sessionStorage.setItem('bunkr_runtime','old-runtime');sessionStorage.setItem('afterlight_runtime','legacy-runtime');sessionStorage.setItem('unrelated_session_key','keep');
      frame.addEventListener('load',()=>{loads++;if(started)return;setTimeout(()=>{const before=frame.contentWindow.BunkrState?.snapshot();if(before?.coins!==rich.coins){finish(false,{stage:'seed',beforeCoins:before?.coins});return}started=true;frame.contentWindow.BunkrState.resetAll('RESET')},350)});
      const watcher=setInterval(()=>{if(done||!started)return;try{const state=frame.contentWindow.BunkrState?.snapshot(),url=frame.contentWindow.location.search.startsWith('?reset=');if(!url||state?.schema!==20)return;const localOwned=[...Array(localStorage.length)].map((_,i)=>localStorage.key(i)).filter(key=>/^(?:bunkr|afterlight)/i.test(key)),sessionOwned=[...Array(sessionStorage.length)].map((_,i)=>sessionStorage.key(i)).filter(key=>/^(?:bunkr|afterlight)/i.test(key)),clean=state.coins<2&&state.total<2&&state.food===25&&state.water===25&&state.power<5&&state.scrap===0&&state.science===0&&state.uranium===0&&state.kills===0&&state.rooms?.generator===1&&Object.entries(state.rooms||{}).filter(([id])=>id!=='generator').every(([,value])=>value===0)&&state.prestige?.level===0&&state.prestige?.cores===0&&state.missions?.claimed?.length===0&&state.command?.account?.loggedIn===false&&state.survivorSkins?.selected==='ranger-male'&&state.survivorSkins?.unlocked?.join(',')==='ranger-male,ranger-female',storage=localOwned.join(',')==='bunkr_last_shelter_v1'&&sessionOwned.length===0&&localStorage.getItem('bunkr_prestige_backup_v1')===null&&localStorage.getItem('bunkr_future_system')===null,unrelated=localStorage.getItem('unrelated_probe_key')==='keep'&&sessionStorage.getItem('unrelated_session_key')==='keep';finish(clean&&storage&&unrelated,{loads,clean,storage,unrelated,url,localOwned,sessionOwned,schema:state.schema,coins:state.coins,food:state.food,water:state.water,prestige:state.prestige?.level,account:state.command?.account?.loggedIn,survivors:state.survivorSkins?.unlocked})}catch{}},100);
      setTimeout(()=>finish(false,{stage:'timeout',loads,started,frameUrl:frame.contentWindow.location.href}),6500);
      function finish(passed,detail){if(done)return;done=true;clearInterval(watcher);document.body.dataset.accountResetProbe=passed?'passed':'failed';report.textContent='BUNKR_ACCOUNT_RESET_'+(passed?'PASS ':'FAIL ')+JSON.stringify(detail)}
      frame.src='../index.html?v=account-reset-probe';
    })();
  </script>
</body>
</html>
