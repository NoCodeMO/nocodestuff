<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Afterlight Architect unlock probe</title>
  <style>html,body{margin:0;background:#080a08;color:#fff;font:12px monospace}iframe{display:block;width:900px;height:700px;border:0}</style>
</head>
<body data-architect-probe="running">
  <iframe id="gameFrame" title="Afterlight Architect probe"></iframe>
  <output id="architectReport" hidden></output>
  <script>
    (()=>{'use strict';
      const rooms={generator:53,workshop:49,greenhouse:49,purifier:49,lab:49,living:49,storage:49,turret:49},frame=document.getElementById('gameFrame'),report=document.getElementById('architectReport');
      localStorage.setItem('afterlight_v4',JSON.stringify({schema:12,rooms,survivorSkins:{selected:'ranger-male',unlocked:['ranger-male','ranger-female']},last:Date.now()}));
      frame.src='../index.html?v=architect-probe';
      function finish(){
        const win=frame.contentWindow,doc=frame.contentDocument,state=win.AfterlightState.snapshot(),before=win.AfterlightGame.rates().coins,unlockedAt100=state.bunker===100&&state.survivorSkins.unlocked.includes('architect'),selected=win.AfterlightCommandCenter.selectSurvivor('architect'),after=win.AfterlightGame.rates().coins,multiplier=win.AfterlightGame.survivorProductionMultiplier();
        win.AfterlightCommandCenter.render(doc.getElementById('drawerBody'));win.AfterlightCommandCenter.setTab('survivors',doc.getElementById('drawerBody'));
        const activeCard=doc.querySelector('[data-survivor-slot="architect"].selected'),stage=doc.getElementById('spriteStage'),survivorUnit=doc.querySelector('.survivorUnit'),passed=unlockedAt100&&selected&&Math.abs(after/before-1.5)<1e-9&&multiplier===1.5&&!!activeCard&&stage?.dataset.survivorId==='architect'&&survivorUnit?.dataset.muzzleAnchor==='79.3% 14.8%';
        document.body.dataset.architectProbe=passed?'passed':'failed';report.textContent='AFTERLIGHT_ARCHITECT_'+(passed?'PASS ':'FAIL ')+JSON.stringify({bunker:state.bunker,unlockedAt100,selected,multiplier,rateRatio:after/before,activeCard:!!activeCard,survivorId:stage?.dataset.survivorId,muzzleAnchor:survivorUnit?.dataset.muzzleAnchor});
      }
      frame.addEventListener('load',()=>setTimeout(finish,1000));
    })();
  </script>
</body>
</html>
