<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Bunkr Research Network probe</title><style>html,body{margin:0;background:#050705}.probe{position:absolute;inset:0;border:0}</style></head>
<body data-research-network-probe="running">
  <iframe class="probe" title="Responsive Research Network probe"></iframe>
  <output id="researchNetworkReport" hidden></output>
  <script>
    (()=>{'use strict';
      const params=new URLSearchParams(location.search),landscape=params.get('landscape')==='1',frame=document.querySelector('iframe'),report=document.getElementById('researchNetworkReport'),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      frame.width=landscape?844:390;frame.height=landscape?390:844;
      for(let index=localStorage.length-1;index>=0;index--){const key=localStorage.key(index);if(/^bunkr/i.test(key||''))localStorage.removeItem(key)}
      function geometry(win,root){
        const visible=element=>win.getComputedStyle(element).display!=='none',branches=[...root.querySelectorAll('[data-research-branch-row]')],visibleBranches=branches.filter(visible),treeViewport=root.querySelector('.researchTreeViewport'),viewportBox=treeViewport.getBoundingClientRect(),activeBranch=root.querySelector('.researchBranch.mobileActive'),nodeBoxes=[...activeBranch.querySelectorAll('[data-research-node]')].map(node=>node.getBoundingClientRect()),navBox=root.querySelector('.researchBranchNav').getBoundingClientRect(),inspectorBox=root.querySelector('.researchInspector').getBoundingClientRect(),nodesFit=nodeBoxes.every(box=>box.left>=viewportBox.left-2&&box.right<=viewportBox.right+2),ordered=landscape?nodeBoxes.every((box,index)=>index===0||(box.left>nodeBoxes[index-1].left&&Math.abs(box.top-nodeBoxes[index-1].top)<5)):nodeBoxes.every((box,index)=>index===0||box.top>=nodeBoxes[index-1].bottom-2);
        return{visibleBranches:visibleBranches.length,activeNodes:nodeBoxes.length,noPageOverflow:root.scrollWidth<=root.clientWidth+2,treeFits:treeViewport.scrollWidth<=treeViewport.clientWidth+2,nodesFit,ordered,navBeforeTree:navBox.bottom<=viewportBox.top+2,inspectorPlaced:landscape?inspectorBox.left>=viewportBox.right-2:inspectorBox.top>=viewportBox.bottom-2};
      }
      async function inspect(){
        const win=frame.contentWindow,doc=frame.contentDocument,state=win.BunkrState.get(),drawer=doc.getElementById('drawer');
        doc.querySelector('[data-tab="research"]').click();await wait(180);
        let root=doc.getElementById('drawerBody'),nodes=[...root.querySelectorAll('[data-research-node]')],branches=[...root.querySelectorAll('[data-research-branch-row]')],start=root.querySelector('[data-research-action="filters"]'),before={drawer:drawer.classList.contains('researchDrawer'),command:root.dataset.researchCommand,nodes:nodes.length,branches:branches.length,level:state.research.filters,scrap:state.scrap,science:state.science,startEnabled:!!start&&!start.disabled};
        start.click();const active={id:state.researchRuntime.active?.id,scrapCost:state.researchRuntime.active?.scrapCost,scienceCost:state.researchRuntime.active?.scienceCost,scrapReduced:state.scrap<=before.scrap-27,scienceReduced:state.science<before.science,bar:!!root.querySelector('[data-research-progress]')};
        state.researchRuntime.active.end=Date.now()-1;win.BunkrResearch.finish();await wait(80);const ready={id:state.researchRuntime.ready?.id,badge:doc.getElementById('researchBadge').classList.contains('visible'),install:!!root.querySelector('[data-research-claim]')};
        win.BunkrResearch.claim();await wait(80);const installed={level:state.research.filters,ready:state.researchRuntime.ready,badge:doc.getElementById('researchBadge').classList.contains('visible')};
        root=doc.getElementById('drawerBody');if(landscape){root.querySelector('[data-research-branch="field"]').click();await wait(80);root=doc.getElementById('drawerBody')}
        const responsive=geometry(win,root),expectedNodes=landscape?5:4;
        const passed=before.drawer&&before.command==='ready'&&before.nodes===17&&before.branches===4&&before.level===2&&before.startEnabled&&active.id==='filters'&&active.scrapCost===27&&active.scienceCost===6&&active.scrapReduced&&active.scienceReduced&&active.bar&&ready.id==='filters'&&ready.badge&&ready.install&&installed.level===3&&installed.ready===null&&!installed.badge&&responsive.visibleBranches===1&&responsive.activeNodes===expectedNodes&&responsive.noPageOverflow&&responsive.treeFits&&responsive.nodesFit&&responsive.ordered&&responsive.navBeforeTree&&responsive.inspectorPlaced;
        document.body.dataset.researchNetworkProbe=passed?'passed':'failed';report.textContent='BUNKR_RESEARCH_NETWORK_'+(passed?'PASS ':'FAIL ')+JSON.stringify({profile:landscape?'landscape':'portrait',before,active,ready,installed,responsive});
      }
      frame.addEventListener('load',()=>setTimeout(()=>inspect().catch(error=>{document.body.dataset.researchNetworkProbe='failed';report.textContent='BUNKR_RESEARCH_NETWORK_FAIL '+error.stack}),900));frame.src='../index.html?v=research-network-probe&researchNetworkTest=1';
    })();
  </script>
</body>
</html>
